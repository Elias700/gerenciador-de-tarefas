<section class="grid grid-cols-1 gap-4 lg:grid-cols-[3fr_2fr]">

  <!-- GANHOS MENSAIS -->
  <mat-card appearance="outlined" class="!rounded-2xl !border-border !bg-surface">
    <mat-card-content class="!p-5">

      <div class="flex items-start justify-between">
        <div>
          <h2 class="text-sm font-semibold text-text">Ganhos Mensais</h2>
          <p class="text-xs text-text-secondary">Últimos 6 meses</p>
        </div>
        <span class="rounded-full bg-primary-light px-3 py-1 text-xs font-semibold text-primary">
          2026
        </span>
      </div>

      <div class="mt-6 flex h-56 items-end gap-3">
        @for (item of ganhos; track item.mes) {
          <div class="flex h-full flex-1 flex-col">
            <div class="flex flex-1 items-end">
              <div
                class="w-full rounded-t-lg"
                [class]="$last ? 'bg-primary' : 'bg-border'"
                [style.height.%]="item.altura"></div>
            </div>
            <span class="mt-2 text-center text-xs text-text-secondary">{{ item.mes }}</span>
          </div>
        }
      </div>

    </mat-card-content>
  </mat-card>

  <!-- TIPO DE PLANTÃO -->
  <mat-card appearance="outlined" class="!rounded-2xl !border-border !bg-surface">
    <mat-card-content class="!p-5">

      <h2 class="text-sm font-semibold text-text">Tipo de Plantão</h2>
      <p class="text-xs text-text-secondary">Distribuição — Set/2026</p>

      <div class="mt-6 space-y-4">
        @for (tipo of tipos; track tipo.nome) {
          <div>
            <div class="mb-1.5 flex justify-between text-xs">
              <span class="font-semibold text-text">{{ tipo.nome }}</span>
              <span class="text-text-secondary">{{ tipo.qtd }}</span>
            </div>
            <div class="h-1.5 rounded-full bg-background">
              <div class="h-full rounded-full bg-primary" [style.width.%]="tipo.largura"></div>
            </div>
          </div>
        }
      </div>

      <div class="mt-6 grid grid-cols-2 gap-3 border-t border-border pt-4">
        <div class="rounded-xl bg-background p-3">
          <p class="text-lg font-semibold text-text">8</p>
          <p class="text-xs text-text-secondary">Plantões/mês</p>
        </div>
        <div class="rounded-xl bg-primary-light p-3">
          <p class="text-lg font-semibold text-primary">96h</p>
          <p class="text-xs text-text-secondary">Horas/mês</p>
        </div>
      </div>

    </mat-card-content>
  </mat-card>

</section>
