<div
  class="
    min-h-full
    bg-background
    px-4
    py-6
    sm:px-6
    sm:py-8
    lg:px-8
  "
>

  <div class="mx-auto w-full max-w-5xl">

    <!-- ================================================= -->
    <!-- CABEÇALHO -->
    <!-- ================================================= -->

    <header class="mb-6 sm:mb-8">

      <h1
        class="
          text-2xl
          font-bold
          tracking-tight
          text-text
          sm:text-3xl
        "
      >
        Configurações
      </h1>

      <p
        class="
          mt-1
          text-sm
          text-text-secondary
          sm:text-base
        "
      >
        Gerencie sua conta e preferências
      </p>

    </header>


    <!-- ================================================= -->
    <!-- CARD DO PROFISSIONAL -->
    <!-- ================================================= -->

    <section
      class="
        overflow-hidden
        rounded-2xl
        bg-sidebar
        p-5
        shadow-sm
        sm:p-6
      "
    >

      <div
        class="
          flex
          items-center
          gap-4
        "
      >

        <!-- ============================================= -->
        <!-- AVATAR -->
        <!-- ============================================= -->

        <div
          class="
            flex
            h-14
            w-14
            shrink-0
            items-center
            justify-center
            rounded-xl
            bg-primary
            text-base
            font-bold
            text-white
            sm:h-16
            sm:w-16
            sm:text-lg
          "
        >
          {{ profissional.iniciais }}
        </div>


        <!-- ============================================= -->
        <!-- DADOS DO PROFISSIONAL -->
        <!-- ============================================= -->

        <div class="min-w-0">

          <h2
            class="
              truncate
              text-base
              font-semibold
              text-sidebar-text
              sm:text-lg
            "
          >
            {{ profissional.nome }}
          </h2>


          <p
            class="
              mt-0.5
              text-xs
              text-sidebar-muted
              sm:text-sm
            "
          >
            {{ profissional.profissao }}
            ·
            {{ profissional.crm }}
          </p>


          <p
            class="
              mt-1
              truncate
              text-xs
              text-sidebar-muted
              sm:text-sm
            "
          >
            {{ profissional.email }}
          </p>

        </div>

      </div>

    </section>

  </div>

</div>
