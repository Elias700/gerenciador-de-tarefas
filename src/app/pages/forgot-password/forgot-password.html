<div class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-8">

    <div class="w-full max-w-md">

        <mat-card class="!rounded-2xl !p-6 sm:!p-8 !shadow-xl">

            <div class="text-center mb-8">

                <h1 class="text-3xl sm:text-4xl font-bold text-slate-800">
                    Recuperar senha
                </h1>

                <p class="mt-2 text-sm sm:text-base text-slate-500">
                    Informe seu email para recuperar sua senha
                </p>

            </div>


            <form class="w-full">

                <mat-form-field
                    appearance="outline"
                    class="w-full !mb-5"
                >

                    <mat-label>Email</mat-label>

                    <input
                        type="email"
                        matInput
                        placeholder="Digite seu email"
                    >

                </mat-form-field>


                <button
                    matButton="filled"
                    type="submit"
                    class="!w-full !min-h-12 !text-base"
                >
                    Enviar link de recuperação
                </button>

            </form>


            <div class="text-center mt-7">

                <a
                    routerLink="/login"
                    class="text-sm font-semibold text-blue-600 hover:text-blue-800 hover:underline transition"
                >
                    Voltar para o login
                </a>

            </div>

        </mat-card>

    </div>

</div>
