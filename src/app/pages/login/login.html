```html
<div class="min-h-screen bg-background flex items-center justify-center px-4 py-8">

    <div class="w-full max-w-md">

        <mat-card class="!rounded-2xl !p-6 sm:!p-8 !shadow-xl">

            <!-- Cabeçalho -->
            <div class="text-center mb-8">

                <h1 class="text-3xl sm:text-4xl font-bold text-text">
                    Login
                </h1>

                <p class="mt-2 text-sm sm:text-base text-text-secondary">
                    Entre na sua conta para continuar
                </p>

            </div>


            <!-- Formulário -->
            <form>

                <!-- Email -->
                <mat-form-field appearance="outline" class="w-full mb-3">

                    <mat-label>Email</mat-label>

                    <input type="email" matInput placeholder="Digite seu email">

                </mat-form-field>


                <!-- Senha -->
                <mat-form-field appearance="outline" class="w-full mb-2">

                    <mat-label>Senha</mat-label>

                    <input type="password" matInput placeholder="Digite sua senha">

                </mat-form-field>


                <!-- Recuperar senha -->
                <div class="flex justify-end mb-6">

                    <a routerLink="/recuperar-senha" class="
                            text-sm
                            font-medium
                            text-primary
                            hover:text-primary-dark
                            hover:underline
                            transition
                        ">
                        Esqueci minha senha
                    </a>

                </div>


                <!-- Botão -->
                <button matButton="filled" type="submit" class="
                        !w-full
                        !min-h-12
                        !text-base
                    ">
                    Entrar
                </button>

            </form>


            <!-- Separador -->
            <div class="flex items-center gap-3 my-7">

                <div class="h-px flex-1 bg-border"></div>

                <span class="text-sm text-text-secondary">
                    ou
                </span>

                <div class="h-px flex-1 bg-border"></div>

            </div>


            <!-- Cadastro -->
            <div class="text-center">

                <p class="text-sm text-text-secondary">
                    Ainda não possui uma conta?
                </p>

                <a routerLink="/cadastro" class="
                        inline-block
                        mt-2
                        text-sm
                        font-semibold
                        text-primary
                        hover:text-primary-dark
                        hover:underline
                        transition
                    ">
                    Criar uma conta
                </a>

            </div>

        </mat-card>

    </div>

</div>
```
